name: Probably Genetic
description: 'Probably Genetic is a healthcare company focused on rare disease diagnosis through
  genetic testing. It offers free targeted genetic testing programs for specific rare conditions
  (including alpha-mannosidosis, cerebrotendinous xanthomatosis, GRN-FTD, and SYNGAP1-related
  disorder), insurance-billed testing paired with genetic counselors, at-home saliva/cheek-swab
  collection kits, and physician-ordered genetic counseling. The platform has served more than
  200,000 patients and partners with 50+ patient advocacy groups to advance rare disease research.
  This is a consumer-facing healthcare provider with no public API or developer program surface.'
